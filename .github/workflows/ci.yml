name: Moodle Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ci_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd mariadb-admin ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
        moodle-branch: ['MOODLE_401_STABLE', 'MOODLE_404_STABLE', 'main']
        database: [pgsql, mysqli]
        exclude:
          - moodle-branch: main
            php: '8.1'
          - moodle-branch: main
            database: pgsql
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, gd, intl, zip, pgsql, mysqli
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && bin/moodle-plugin-ci.phar --version)

      - name: Install Moodle
        run: |
          ci/bin/moodle-plugin-ci.phar install --plugin ./plugin --dbtype=${{ matrix.database }} --dbhost=127.0.0.1 --dbuser=${{ matrix.database == 'pgsql' && 'postgres' || 'root' }} --dbpass=${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        run: ci/bin/moodle-plugin-ci.phar phplint

      - name: PHP Copy/Paste Detector
        run: ci/bin/moodle-plugin-ci.phar phpcpd

      - name: PHP Mess Detector
        run: ci/bin/moodle-plugin-ci.phar phpmd

      - name: Moodle Code Checker
        run: ci/bin/moodle-plugin-ci.phar codechecker

      - name: Validate changes
        run: ci/bin/moodle-plugin-ci.phar validate

      - name: Savepoints
        run: ci/bin/moodle-plugin-ci.phar savepoints

      - name: Mustache
        run: ci/bin/moodle-plugin-ci.phar mustache

      - name: Grunt
        run: ci/bin/moodle-plugin-ci.phar grunt

      - name: PHPUnit tests
        run: ci/bin/moodle-plugin-ci.phar phpunit

      - name: Behat features
        run: ci/bin/moodle-plugin-ci.phar behat
